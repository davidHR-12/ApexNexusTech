<div class="bg-[#1e293b] border border-gray-700 rounded-xl shadow-2xl overflow-hidden mb-2">
  {% for m in materiales %}
    <button type="button" 
            onclick="seleccionarMaterial('{{ m.id }}', '{{ m.marca.nombre }} - {{ m.tipo.nombre }} - {{ m.color.nombre }}')"
            class="resultado-item search-result-item w-full text-left p-3 hover:bg-blue-600/20 border-b border-gray-800 last:border-0 transition-colors group">
      <div class="flex justify-between items-center">
        <div>
          <div class="text-sm font-bold text-white group-hover:text-blue-400">
            {{ m.marca.nombre }} - {{ m.tipo.nombre }} - {{ m.color.nombre }}
          </div>
          <div class="text-[10px] text-gray-500 uppercase">{{ m.tipo.nombre }}</div>
        </div>
        {% if m.stock_actual > m.stock_minimo %}
        <div class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-500 text-[10px] font-bold uppercase border border-emerald-500/20">
          {{ m.stock_actual|floatformat:0 }}g Óptimo
        </div>
        {% else %}
        <div class="px-2.5 py-1 rounded-lg bg-rose-500/10 text-rose-500 text-[10px] font-bold uppercase border border-rose-500/20">
          {{ m.stock_actual|floatformat:0 }}g Crítico
        </div>
        {% endif %}
      </div>
    </button>
  {% empty %}
    <div class="p-4 text-center text-gray-500 text-sm italic">
      No se encontraron coincidencias
    </div>
  {% endfor %}
</div>
