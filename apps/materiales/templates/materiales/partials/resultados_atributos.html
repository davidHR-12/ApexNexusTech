<div class="bg-gray-800 border border-gray-700 rounded-lg shadow-xl overflow-hidden mt-1 max-h-40 overflow-y-auto">
    {% for r in resultados %}
    <button type="button" 
            onclick="seleccionarAtributo('{{ tipo }}', '{{ r.nombre }}')"
            class="w-full text-left p-2 hover:bg-blue-600/30 text-sm text-gray-200 border-b border-gray-700 last:border-0 transition-colors">
        {{ r.nombre }}
    </button>
    {% empty %}
    <div class="p-2 text-xs text-gray-500 italic">No se encontraron coincidencias (se creará nuevo)</div>
    {% endfor %}
</div>
