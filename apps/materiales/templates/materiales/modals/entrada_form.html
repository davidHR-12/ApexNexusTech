{% extends "core/modal_base.html" %}
{% block modal_content %}
  <div class="mb-6">
    <h2 class="text-xl font-bold text-white">Registrar Compra</h2>
    <p class="text-gray-400 text-xs">Aumenta el stock y actualiza el costo promedio.</p>
  </div>
  <form id="formEntradaMaterial"
        action="{% url 'materiales:registrar_entrada' %}"
        method="post"
        class="space-y-5">
    {% csrf_token %}
    <div class="relative" x-data="{ query: '' }">
      <label class="text-gray-400 text-xs uppercase mb-2 block font-semibold tracking-wide">Buscar Material</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input type="text"
               name="q"
               id="material-search-input"
               placeholder="ej: Bambu Lab PLA Azul"
               class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 pl-10 text-white focus:border-blue-500 outline-none transition-all"
               hx-get="{% url 'materiales:buscar_material_ajax' %}"
               hx-trigger="keyup[key!='ArrowDown'&&key!='ArrowUp'&&key!='Enter'] changed delay:300ms"
               hx-target="#search-results"
               @input="if($el.value === '') { document.getElementById('search-results').innerHTML = '' }"
               autocomplete="off">
        <input type="hidden" name="material" id="material-id-hidden">
      </div>
      <div id="search-results" class="absolute z-50 w-full mt-1 overflow-hidden"></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50 focus-within:border-blue-500/50 transition-all">
        <label class="text-gray-400 text-[10px] uppercase mb-1 block font-bold tracking-wider">Cantidad (Gramos)</label>
        <input type="number"
               step="0.01"
               min="0.01"
               name="cantidad_gramos"
               placeholder="ej: 1000"
               class="w-full bg-transparent text-white font-mono text-lg outline-none"
               required>
      </div>
      <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50 focus-within:border-blue-500/50 transition-all">
        <label class="text-gray-400 text-[10px] uppercase mb-1 block font-bold tracking-wider">Costo Total (RD$)</label>
        <input type="number"
               step="1"
               min="0"
               name="costo_total"
               placeholder="ej: 1500"
               class="w-full bg-transparent text-white font-mono text-lg outline-none"
               required>
      </div>
    </div>
    <div class="bg-blue-500/10 p-4 rounded-xl border border-blue-500/20 flex gap-3">
      <svg class="w-5 h-5 text-blue-400 shrink-0"
           fill="none"
           stroke="currentColor"
           viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-[11px] text-blue-300 leading-snug">
        <b>Tip:</b> Si compraste un rollo de 1kg, pon 1000g. El sistema recalculará el <b>costo promedio por gramo</b> automáticamente.
      </p>
    </div>
    <div class="flex gap-3 pt-4">
      <button type="button"
              onclick="cerrarModales()"
              class="flex-1 px-4 py-3 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-all font-bold text-sm">
        Cancelar
      </button>
      <button type="submit"
              class="flex-1 px-4 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-500 transition-all shadow-lg shadow-blue-900/40 text-sm uppercase tracking-wider">
        Guardar Entrada
      </button>
    </div>
  </form>
{% endblock modal_content %}
