{% extends "core/modal_base.html" %}
{% block modal_content %}
  <div class="mb-6">
    <h2 class="text-xl font-bold text-white">Registrar Compra</h2>
    <p class="text-gray-400 text-xs">Aumenta el stock y actualiza el costo promedio.</p>
  </div>
  <form id="formEntradaMaterial"
        action="{% url 'materiales:registrar_entrada' %}"
        method="POST"
        class="space-y-5">
    {% csrf_token %}
    <div>
      <label class="text-gray-400 text-xs uppercase mb-2 block font-semibold tracking-wide">Seleccionar Material</label>
      <select name="material"
              class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 outline-none appearance-none cursor-pointer"
              required>
        <option value="" disabled selected>Busca el filamento...</option>
        {% for m in materiales %}
          <option value="{{ m.id }}">
            {{ m.marca.nombre }} {{ m.tipo.nombre }} - {{ m.color.nombre }} (Actual: {{ m.stock_actual|floatformat:0 }}g)
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50 focus-within:border-blue-500/50 transition-all">
        <label class="text-gray-400 text-[10px] uppercase mb-1 block font-bold tracking-wider">Cantidad (Gramos)</label>
        <input type="number"
               step="0.01"
               min="0.01"
               name="cantidad_gramos"
               placeholder="ej: 1000"
               class="w-full bg-transparent text-white font-mono text-lg outline-none"
               required>
      </div>
      <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50 focus-within:border-blue-500/50 transition-all">
        <label class="text-gray-400 text-[10px] uppercase mb-1 block font-bold tracking-wider">Costo Total (RD$)</label>
        <input type="number"
               step="1"
               min="0"
               name="costo_total"
               placeholder="ej: 1500"
               class="w-full bg-transparent text-white font-mono text-lg outline-none"
               required>
      </div>
    </div>
    <div class="bg-blue-500/10 p-4 rounded-xl border border-blue-500/20 flex gap-3">
      <svg class="w-5 h-5 text-blue-400 shrink-0"
           fill="none"
           stroke="currentColor"
           viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-[11px] text-blue-300 leading-snug">
        <b>Tip:</b> Si compraste un rollo de 1kg, pon 1000g. El sistema recalculará el <b>costo promedio por gramo</b> automáticamente.
      </p>
    </div>
    <div class="flex gap-3 pt-4">
      <button type="button"
              onclick="cerrarModales()"
              class="flex-1 px-4 py-3 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-all font-bold text-sm">
        Cancelar
      </button>
      <button type="submit"
              class="flex-1 px-4 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-500 transition-all shadow-lg shadow-blue-900/40 text-sm uppercase tracking-wider">
        Guardar Entrada
      </button>
    </div>
  </form>
{% endblock %}
