{% extends "core/base_admin.html" %}

{% block content %}
  <div class="space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-3xl font-bold text-white">Gestión de Pedidos</h1>
      <button class="bg-[#10b981] hover:bg-[#059669] text-white px-4 py-2 rounded-xl font-bold transition shadow-lg">
        + Nuevo Pedido Manual
      </button>
    </div>
    <div class="bg-[#1e293b] border border-gray-800 rounded-2xl overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-[#334155] text-gray-300 text-sm uppercase">
          <tr>
            <th class="p-4">ID</th>
            <th class="p-4">Cliente</th>
            <th class="p-4">Pieza</th>
            <th class="p-4">Estado</th>
            <th class="p-4">Total</th>
            <th class="p-4">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-800">
          <tr class="hover:bg-[#334155]/50 transition">
            <td class="p-4 text-gray-400">#001</td>
            <td class="p-4 font-medium">Juan Pérez</td>
            <td class="p-4">Engranaje Industrial</td>
            <td class="p-4">
              <span class="bg-yellow-500/10 text-yellow-500 px-3 py-1 rounded-full text-xs font-bold border border-yellow-500/20">Pendiente</span>
            </td>
            <td class="p-4 text-[#10b981] font-bold">RD$ 1,500</td>
            <td class="p-4">
              <button class="text-gray-400 hover:text-white">Ver detalles</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
{% endblock content %}
