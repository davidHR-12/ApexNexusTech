<div id="modalEditarNotas"
     class="fixed inset-0 z-[60] flex items-center justify-center modal-overlay bg-black/50 backdrop-blur-sm p-4 hidden">
    <div class="bg-[#1e293b] border border-gray-700 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-emerald-500"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                Nueva Nota de Seguimiento
            </h3>
            <button onclick="cerrarUltimoModal()" class="text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form action="{% url 'pedidos:agregar_nota_pedido' pedido.id %}"
              method="post"
              class="p-6">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-2 block">Contenido de la nota</label>
                    <textarea name="contenido"
                              rows="5"
                              required
                              class="w-full bg-[#0f172a] border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500 transition-all"
                              placeholder="Escribe aquí los detalles del avance o notas internas..."></textarea>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-900/50 rounded-xl border border-gray-700">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-white">¿Visible para el cliente?</span>
                        <span class="text-[10px] text-gray-500">Si lo activas, el cliente podrá leer esta nota en su panel.</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="visible_para_cliente" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600">
                        </div>
                    </label>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button type="button"
                        onclick="cerrarUltimoModal()"
                        class="px-5 py-2.5 rounded-xl text-gray-400 hover:bg-gray-700 transition-all font-semibold text-sm">
                    Cancelar
                </button>
                <button type="submit"
                        class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-emerald-900/20 text-sm">
                    Guardar Nota
                </button>
            </div>
        </form>
    </div>
</div>
