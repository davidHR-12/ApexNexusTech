{% extends "core/modal_base.html" %}
{% block modal_content %}
    <form method="post"
          action="{% url 'pedidos:crear_pedido' %}"
          class="space-y-5">
        {% csrf_token %}
        <div class="space-y-4">
            <div id="contenedor-usuario">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-400">¿Para quién es el pedido?</label>
                    <button type="button"
                            onclick="abrirModal('modalClienteExpress')"
                            class="text-xs text-emerald-400 hover:text-emerald-300 hover:underline font-bold flex items-center gap-1 transition-colors">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M12 4v16m8-8H4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Nuevo Cliente Rápido
                    </button>
                </div>
                {{ form.usuario }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">¿Qué solicitó el cliente?</label>
                {{ form.descripcion }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Estado Inicial</label>
                {{ form.estado_pedido }}
            </div>
        </div>
        <div class="flex gap-3 pt-6 mt-6 border-t border-gray-800">
            <button type="button"
                    onclick="cerrarUltimoModal()"
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-all font-bold text-sm">
                Cancelar
            </button>
            <button type="submit"
                    class="flex-1 px-4 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white transition-all font-bold text-sm">
                Continuar a Cotización →
            </button>
        </div>
    </form>
{% endblock modal_content %}
