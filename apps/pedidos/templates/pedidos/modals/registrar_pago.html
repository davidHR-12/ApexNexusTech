<div id="modalRegistrarPago"
     class="fixed inset-0 z-[60] flex items-center justify-center modal-overlay bg-black/60 backdrop-blur-sm p-4 hidden">
    <div class="bg-[#1e293b] border border-gray-700 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">

        <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                Registrar Pago
            </h3>
            <button onclick="cerrarUltimoModal()" class="text-gray-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form method="POST" action="{% url 'pedidos:registrar_pago' pedido.id %}" class="p-6 space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                    Monto Recibido (RD$) <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm font-bold">RD$</span>
                    <input type="number" name="monto" required step="0.01" min="0.01"
                           placeholder="0.00"
                           value="{{ pedido.saldo_pendiente }}"
                           class="w-full bg-[#0f172a] border border-gray-700 rounded-xl pl-12 pr-4 py-3 text-white text-sm font-mono outline-none focus:border-emerald-500 transition-all">
                </div>
                <p class="text-gray-600 text-xs mt-1">Saldo pendiente: RD$ {{ pedido.saldo_pendiente|floatformat:2 }}</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                    Método <span class="text-red-400">*</span>
                </label>
                <select name="metodo" required
                        class="w-full bg-[#0f172a] border border-gray-700 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500 transition-all">
                    <option value="">— Seleccionar —</option>
                    <option value="Efectivo"
                        {% if pedido.metodo_pago_preferido == 'Efectivo' %}selected{% endif %}>
                        Efectivo
                    </option>
                    <option value="Transferencia"
                        {% if pedido.metodo_pago_preferido == 'Transferencia' %}selected{% endif %}>
                        Transferencia bancaria
                    </option>
                    <option value="Tarjeta">Tarjeta de crédito/débito</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                    Referencia / Confirmación
                </label>
                <input type="text" name="referencia"
                       placeholder="Ej: #TRX-00912, número de recibo..."
                       class="w-full bg-[#0f172a] border border-gray-700 rounded-xl px-4 py-3 text-white text-sm font-mono outline-none focus:border-emerald-500 transition-all placeholder-gray-600">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Notas</label>
                <textarea name="notas" rows="2"
                          placeholder="Notas opcionales sobre el pago..."
                          class="w-full bg-[#0f172a] border border-gray-700 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500 transition-all resize-none placeholder-gray-600"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="button" onclick="cerrarUltimoModal()"
                        class="flex-1 px-4 py-3 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-all font-bold text-sm">
                    Cancelar
                </button>
                <button type="submit"
                        class="flex-1 px-4 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition-all shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Registrar Pago
                </button>
            </div>
        </form>
    </div>
</div>
