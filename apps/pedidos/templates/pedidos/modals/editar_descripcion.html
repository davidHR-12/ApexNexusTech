<div id="modalEditarDescripcion" class="fixed inset-0 z-[60] flex items-center justify-center hidden modal-overlay bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-[#1e293b] border border-gray-700 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
            <h3 class="text-xl font-bold text-white">Editar Descripción</h3>
            <button onclick="cerrarUltimoModal()" class="text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <form action="{% url 'pedidos:editar_descripcion' pedido.id %}" method="POST" class="p-6">
            {% csrf_token %}
            <div class="space-y-4">
                <p class="text-xs text-gray-400 uppercase font-bold">Descripción del Pedido</p>
                <textarea name="descripcion" 
                          rows="6" 
                          class="w-full bg-[#0f172a] border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-[#10b981] transition-all"
                          placeholder="Detalles, requerimientos o notas del cliente...">{{ pedido.descripcion }}</textarea>
                
                <p class="text-[10px] text-gray-500 italic">
                    Nota: Cambiar la descripción no afecta los materiales ya agregados.
                </p>
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button type="button" onclick="cerrarUltimoModal()" class="px-5 py-2.5 rounded-xl text-gray-400 hover:bg-gray-700 transition-all font-semibold">
                    Cancelar
                </button>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold transition-all">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
