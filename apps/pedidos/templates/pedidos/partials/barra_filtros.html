<div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center bg-gray-900/50 p-4 rounded-xl border border-gray-800 shadow-sm">
    <form method="get" class="flex flex-wrap md:flex-nowrap flex-1 gap-3 w-full max-w-3xl">
        
        <div class="relative w-full md:w-64 lg:w-80"> 
            <input type="text"
                   name="q"
                   id="searchInputPedidos"
                   value="{{ busqueda_actual|default:'' }}"
                   placeholder="Buscar..."
                   preserve-focus="true"
                   class="w-full bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 pl-10 transition-all"
                   hx-get="{% url 'pedidos:pedidos_lista' %}"
                   hx-trigger="keyup changed delay:500ms, search"
                   hx-target="#pedidos-container"
                   hx-include="[name='estado']"
                   hx-push-url="true">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <select name="estado"
                hx-get="{% url 'pedidos:pedidos_lista' %}"
                hx-trigger="change"
                hx-target="#pedidos-container"
                hx-include="[name='q']"
                hx-push-url="true"
                class="w-full md:w-44 bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none">
            <option value="">Todos los estados</option>
            {% for codigo, nombre in estados_opciones %}
                <option value="{{ codigo }}" {% if filtro_actual == codigo %}selected{% endif %}>{{ nombre }}</option>
            {% endfor %}
        </select>

        <div id="boton-limpiar-pedidos" class="flex items-center">
            {% if busqueda_actual or filtro_actual %}
                <a href="." class="flex items-center gap-1 text-xs text-red-400 hover:text-red-300 font-bold px-2 transition-colors whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    Limpiar filtros
                </a>
            {% endif %}
        </div>
    </form>

    <button onclick="abrirModal('modalNuevoPedido')"
            class="whitespace-nowrap px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Crear Pedido
    </button>
</div>
