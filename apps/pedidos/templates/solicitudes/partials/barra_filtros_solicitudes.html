{# solicitudes/partials/barra_filtros_solicitudes.html #}
<div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center bg-[#1e293b] p-4 rounded-xl border border-gray-800 shadow-sm">
    <form method="get"
          class="flex flex-wrap md:flex-nowrap flex-1 gap-3 w-full max-w-3xl">
        <div class="relative w-full md:w-64 lg:w-80">
            <input type="text"
                   name="q"
                   id="searchInputSolicitudes"
                   value="{{ busqueda_actual|default:'' }}"
                   placeholder="Buscar cliente, descripción..."
                   preserve-focus="true"
                   class="w-full bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block pl-10 p-2.5 transition-all"
                   hx-get="{% url 'pedidos:solicitudes_list' %}"
                   hx-trigger="keyup changed delay:500ms, search"
                   hx-target="#solicitudes-container"
                   hx-include="[name='estado']"
                   hx-push-url="true">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
        <select name="estado"
                id="selectEstadoSolicitudes"
                hx-get="{% url 'pedidos:solicitudes_list' %}"
                hx-trigger="change"
                hx-target="#solicitudes-container"
                hx-include="[name='q']"
                hx-push-url="true"
                class="w-full md:w-44 bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none">
            <option value="">Todos los estados</option>
            {% for codigo, nombre in estados_opciones %}
                <option value="{{ codigo }}"
                        {% if filtro_actual == codigo %}selected{% endif %}>{{ nombre }}</option>
            {% endfor %}
        </select>
        <div class="flex items-center">
            <a href="."
               id="btn-limpiar"
               class="{% if not busqueda_actual and not filtro_actual %}hidden{% endif %} flex items-center gap-1 text-xs text-red-400 hover:text-red-300 font-bold px-2 transition-colors whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                Limpiar filtros
            </a>
        </div>
    </form>
</div>
<script>
    const inputBusqueda = document.getElementById('searchInputSolicitudes');
    const selectEstado = document.getElementById('selectEstadoSolicitudes');
    const btnLimpiar = document.getElementById('btn-limpiar');

    function actualizarVisibilidadBoton() {
        // Si el input tiene texto O el select no está en la opción vacía ""
        if (inputBusqueda.value.length > 0 || selectEstado.value !== "") {
            btnLimpiar.classList.remove('hidden');
        } else {
            btnLimpiar.classList.add('hidden');
        }
    }

    // Escuchar cambios en el texto
    inputBusqueda.addEventListener('input', actualizarVisibilidadBoton);
    
    // Escuchar cambios en el selector de estado
    selectEstado.addEventListener('change', actualizarVisibilidadBoton);
</script>
