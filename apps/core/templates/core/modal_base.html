<div id="{{ modal_id }}"
     class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-hidden modal-overlay">
  <div class="bg-[#1e293b] border border-gray-800 p-6 rounded-2xl w-full {{ max_width|default:'max-w-md' }} shadow-2xl flex flex-col max-h-[90vh] relative animate-in fade-in zoom-in duration-200">
    <h2 class="text-2xl font-bold text-white">{{ title }}</h2>
    <hr class="border-gray-800 my-4" />
    <button onclick="cerrarModales()"
            class="absolute top-6 right-6 text-gray-400 hover:text-white transition-colors z-20">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    <div class="custom-scrollbar overflow-y-auto">
      {% block modal_content %}
      {% endblock modal_content %}
    </div>
  </div>
</div>
