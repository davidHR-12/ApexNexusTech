{% extends "core/base_admin.html" %}
{% block content %}
  <div class="max-w-2xl space-y-8">
    <h1 class="text-3xl font-bold text-white">Configuración del Sistema</h1>
    <div class="bg-[#1e293b] p-8 rounded-2xl border border-gray-700">
      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-white font-bold">Modo Mantenimiento</p>
            <p class="text-gray-400 text-sm">Bloquea el acceso a clientes temporalmente.</p>
          </div>
          <div class="w-12 h-6 bg-gray-700 rounded-full"></div>
        </div>
        <hr class="border-gray-700">
        <div>
          <label class="text-gray-400 text-sm block mb-1">Precio por gramo (RD$)</label>
          <input type="text"
                 value="5.50"
                 class="bg-[#334155] border border-gray-600 rounded-lg p-2 text-white">
        </div>
      </div>
    </div>
    <div class="bg-[#1e293b] p-8 rounded-2xl border border-gray-700">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-white font-bold">Gestión de Archivos</h3>
          <p class="text-gray-400 text-sm">Archivos huérfanos en la carpeta media.</p>
        </div>
        <a href="{% url 'core:config_media' %}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all">
          Gestionar
        </a>
      </div>
    </div>
  </div>
{% endblock content %}
