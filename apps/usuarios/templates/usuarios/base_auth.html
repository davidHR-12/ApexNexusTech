{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
        <title>
            {% block title %}
            {% endblock title %}
            - 3D Print
        </title>
        {% block extra_css %}
        {% endblock extra_css %}
    </head>
    <body class="bg-[#0f172a] flex items-center justify-center min-h-screen py-10">
        <div class="bg-[#1e293b] p-8 rounded-2xl shadow-2xl w-full {% block card_width %}max-w-md{% endblock card_width %} border border-gray-700">
            <div class="mb-4">
                <a href="{% url 'clientes:index' %}"
                   class="inline-flex items-center text-gray-400 hover:text-[#10b981] transition text-sm group">
                    <svg class="w-4 h-4 mr-1 transform group-hover:-translate-x-1 transition-transform"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Volver al inicio
                </a>
            </div>
            {% block auth_content %}
            {% endblock auth_content %}
        </div>
        {% block extra_js %}
        {% endblock extra_js %}
    </body>
</html>
