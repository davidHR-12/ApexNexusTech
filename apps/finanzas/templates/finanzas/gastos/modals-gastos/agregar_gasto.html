{% extends "core/modal_base.html" %}
{% block modal_content %}
  <div class="mb-6">
    <h2 class="text-xl font-bold text-white">Registrar Nuevo Gasto</h2>
    <p class="text-gray-400 text-xs font-medium uppercase tracking-wider text-red-400/80">Egreso de Caja</p>
  </div>
  <form id="formNuevoGasto"
        action="{% url 'finanzas:crear_gasto' %}"
        method="POST"
        class="space-y-5">
    {% csrf_token %}
    <div>
      <label class="text-gray-400 text-[10px] uppercase mb-2 block font-bold tracking-widest text-gray-500">
        Descripción del Gasto
      </label>
      <input type="text"
             name="descripcion"
             placeholder="Ej: Reparación ventilador, Pago Luz..."
             class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-red-500 outline-none transition-all placeholder:text-gray-600"
             required>
    </div>
    <div>
      <label class="text-gray-400 text-[10px] uppercase mb-2 block font-bold tracking-widest text-gray-500">Categoría</label>
      <div class="relative">
        <select name="tipo"
                class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-red-500 outline-none appearance-none cursor-pointer"
                required>
          <option value="Mantenimiento">Mantenimiento</option>
          <option value="Herramientas">Herramientas y accesorios</option>
          <option value="Energia">Energía</option>
          <option value="Compra_Material">Compra de Material</option>
          <option value="Servicios">Servicios (internet, teléfono, etc.)</option>
          <option value="Otro">Otro</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-red-500/5 p-3 rounded-2xl border border-red-500/20 focus-within:border-red-500/50 transition-all group">
        <label class="text-red-400/70 text-[10px] uppercase mb-1 block font-bold tracking-widest">Monto (RD$)</label>
        <input type="number"
               step="0.01"
               min="0.01"
               name="monto"
               placeholder="0.00"
               class="w-full bg-transparent text-white font-mono text-xl outline-none group-hover:placeholder:text-gray-500"
               required>
      </div>
      <div class="bg-gray-800/40 p-3 rounded-2xl border border-gray-700/50 focus-within:border-gray-500 transition-all">
        <label class="text-gray-400 text-[10px] uppercase mb-1 block font-bold tracking-widest text-gray-500">Fecha</label>
        <input type="date"
               name="fecha"
               value="{% now 'Y-m-d' %}"
               class="w-full bg-transparent text-white text-sm outline-none cursor-pointer"
               required>
      </div>
    </div>
    <div class="flex items-start gap-3 p-4 bg-gray-900/50 rounded-xl border border-gray-800">
      <svg class="w-5 h-5 text-gray-600 shrink-0"
           fill="none"
           stroke="currentColor"
           viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-[10px] text-gray-500 leading-relaxed italic">
        <b>Nota:</b> Si registras una <b>Compra de Material</b> desde el inventario, el gasto se generará automáticamente. Úsalo aquí solo para gastos manuales.
      </p>
    </div>
    <div class="flex gap-3 pt-4 border-t border-gray-800">
      <button type="button"
              onclick="cerrarModales()"
              class="flex-1 px-4 py-3 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-all font-bold text-[10px] uppercase tracking-widest">
        Cancelar
      </button>
      <button type="submit"
              class="flex-1 px-4 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-500 transition-all shadow-lg shadow-red-900/30 text-[10px] uppercase tracking-[0.2em]">
        Confirmar
      </button>
    </div>
  </form>
{% endblock %}
