{% extends "core/modal_base.html" %}
{% block modal_content %}
  <div class="mb-6">
    <h2 id="modalGastoTitulo" class="text-xl font-bold text-white">Registrar Nuevo Gasto</h2>
    <p id="modalGastoSubtitulo"
       class="text-gray-400 text-xs font-medium uppercase tracking-wider text-red-400/80">Egreso de Caja</p>
  </div>
  <form id="formGasto"
        action="{% url 'finanzas:crear_gasto' %}"
        method="POST"
        class="space-y-5">
    {% csrf_token %}
    <div>
      <label class="text-gray-400 text-[10px] uppercase mb-2 block font-bold tracking-widest text-gray-500">
        Descripción
      </label>
      <input type="text"
             name="descripcion"
             placeholder="Ej: Pago de luz por el mes de enero"
             class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-red-500 outline-none transition-all"
             required>
    </div>
    <div>
      <label class="text-gray-400 text-[10px] uppercase mb-2 block font-bold tracking-widest text-gray-500">Categoría</label>
      <div class="relative">
        <select name="tipo"
                id="selectTipoGasto"
                class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-red-500 outline-none appearance-none cursor-pointer disabled:opacity-50"
                required>
          <option value="Mantenimiento">Mantenimiento</option>
          <option value="Herramientas">Herramientas y accesorios</option>
          <option value="Energia">Energía</option>
          <option value="Compra_Material">Compra de Material</option>
          <option value="Servicios">Servicios (internet, teléfono, etc.)</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <input type="hidden" name="tipo_hidden" id="tipoHidden">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-red-500/5 p-3 rounded-2xl border border-red-500/20 group">
        <label class="text-red-400/70 text-[10px] uppercase mb-1 block font-bold">Monto (RD$)</label>
        <input type="number"
               step="1"
               placeholder="0"
               name="monto"
               class="w-full bg-transparent text-white font-mono text-xl outline-none readonly:text-gray-500"
               required>
      </div>
      <div class="bg-gray-800/40 p-3 rounded-2xl border border-gray-700/50">
        <label class="text-gray-400 text-[10px] uppercase mb-1 block font-bold text-gray-500">Fecha</label>
        <input type="date"
               placeholder="Selecciona una fecha"
               name="fecha"
               class="w-full bg-transparent text-white text-sm outline-none readonly:text-gray-500"
               required>
      </div>
    </div>
    <div>
      <label class="text-gray-400 text-[10px] uppercase mb-2 block font-bold tracking-widest text-gray-500">Notas</label>
      <textarea name="notas"
                placeholder="Escribe comentarios u observaciones..."
                rows="2"
                class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-red-500 outline-none text-sm"></textarea>
    </div>
    <div id="infoBoxGasto"
         class="bg-blue-500/10 p-3 rounded-lg border border-blue-500/20">
      <p id="infoTextGasto"
         class="text-[10px] text-blue-300 leading-relaxed italic"></p>
    </div>
    <div class="flex gap-3 pt-4 border-t border-gray-800">
      <button type="button"
              onclick="cerrarModales()"
              class="flex-1 px-4 py-3 rounded-xl border border-gray-700 text-gray-400 font-bold text-[10px] uppercase tracking-widest">
        Cancelar
      </button>
      <button type="submit"
              id="btnSubmitGasto"
              class="flex-1 px-4 py-3 rounded-xl bg-red-600 text-white font-bold text-[10px] uppercase tracking-[0.2em]">
        Confirmar
      </button>
    </div>
  </form>
{% endblock %}
