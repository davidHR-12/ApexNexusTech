<div id="modalProduccionInterna"
     class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-[#1e293b] border border-gray-800 p-8 rounded-3xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[95vh] relative">
        
        <div class="flex justify-between items-center mb-6 shrink-0">
            <div>
                <h2 class="text-2xl font-bold text-white">Registrar Producción</h2>
                <p class="text-xs text-gray-400">El peso total se descontará automáticamente del inventario de materiales.</p>
            </div>
            <button onclick="document.getElementById('modalProduccionInterna').classList.add('hidden')" 
                    class="text-gray-400 hover:text-white p-2 hover:bg-gray-800 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form id="formProduccion" action="{% url 'productos:registrar_produccion' %}" method="POST" class="space-y-6 overflow-y-auto pr-2 custom-scrollbar">
            {% csrf_token %}
            <input type="hidden" name="producto_id" id="prod_id_hidden">
            
            <div class="bg-gray-900/50 p-4 rounded-2xl border border-gray-800">
                <label class="text-[#10b981] text-[10px] uppercase font-bold tracking-widest block mb-1">Producto a fabricar</label>
                <p id="prod_nombre_display" class="text-white font-bold text-xl"></p>
            </div>

            <div class="space-y-3">
                <label class="text-gray-400 text-xs uppercase font-semibold tracking-wide block">Variante de Material / Color</label>
                <select name="variante"
                        id="prod_variante_select"
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-[#10b981] outline-none transition-all cursor-pointer"
                        required>
                    <option value="">Selecciona un material...</option>
                </select>
                <div id="stock_warning" class="hidden text-orange-400 text-[11px] font-medium flex items-center gap-1 italic">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z"/></svg>
                    Aviso: El stock actual es muy bajo para esta cantidad.
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-gray-400 text-xs uppercase font-semibold block">Unidades creadas</label>
                    <div class="relative">
                        <input type="number" name="cantidad" value="1" min="1"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-[#10b981] outline-none pl-10">
                        <svg class="w-5 h-5 text-gray-500 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-gray-400 text-xs uppercase font-semibold block">Peso por unidad (g)</label>
                    <div class="relative">
                        <input type="number" step="0.01" name="peso_usado" id="prod_peso_default"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-[#10b981] outline-none pl-10">
                        <svg class="w-5 h-5 text-gray-500 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                        </svg>
                    </div>
                </div>
            </div>
        </form>

        <div class="flex gap-4 pt-8 mt-6 border-t border-gray-800 shrink-0">
            <button type="button" 
                    onclick="document.getElementById('modalProduccionInterna').classList.add('hidden')"
                    class="px-8 py-3 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-all font-bold text-sm uppercase tracking-wider">
                Cancelar
            </button>
            <button type="submit" 
                    form="formProduccion"
                    class="flex-1 px-8 py-3 rounded-xl bg-[#10b981] text-white font-bold hover:bg-[#059669] shadow-lg shadow-[#10b981]/20 text-sm uppercase tracking-widest transition-all">
                Registrar y Actualizar Stock
            </button>
        </div>
    </div>
</div>
