{% extends "core/modal_base.html" %}
{% block modal_content %}
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-white">Editar Producto Base</h2>
        <p class="text-gray-400 text-sm">Modifica las especificaciones base del modelo.</p>
    </div>
    <form id="formEditarProducto"
          method="post"
          enctype="multipart/form-data"
          class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="text-gray-400 text-[11px] uppercase mb-2 block font-bold tracking-widest">Nombre del Producto</label>
                <input type="text"
                       name="nombre"
                       id="edit_prod_nombre"
                       class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white focus:border-blue-500 outline-none transition-all"
                       required>
            </div>
            <div>
                <label class="text-gray-400 text-[11px] uppercase mb-2 block font-bold tracking-widest">Categoría</label>
                <div class="relative">
                    <select name="categoria"
                            id="edit_prod_categoria"
                            class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white focus:border-blue-500 outline-none appearance-none cursor-pointer"
                            required>
                        {% for cat in categorias %}<option value="{{ cat.id }}">{{ cat.nombre }}</option>{% endfor %}
                    </select>
                    <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-emerald-500/5 p-4 rounded-2xl border border-emerald-500/20 focus-within:border-emerald-500/50 transition-all">
                <label class="text-emerald-400/70 text-[10px] uppercase mb-1 block font-bold">Precio Base (RD$)</label>
                <input type="number"
                       step="0.01"
                       name="precio_venta"
                       id="edit_prod_precio"
                       class="w-full bg-transparent text-white font-mono text-xl outline-none"
                       required>
            </div>
            <div class="flex flex-col gap-2">
                <label class="flex items-center gap-3 p-2.5 bg-gray-900/50 border border-gray-800 rounded-xl cursor-pointer hover:border-blue-500/30 transition-all group">
                    <input type="checkbox"
                           name="mostrar_en_web"
                           id="edit_prod_web"
                           class="w-4 h-4 rounded border-gray-700 text-blue-500 bg-gray-800 focus:ring-0">
                    <span class="text-gray-400 group-hover:text-white text-[10px] font-bold uppercase tracking-tight">Visible en Web</span>
                </label>
                <label class="flex items-center gap-3 p-2.5 bg-gray-900/50 border border-gray-800 rounded-xl cursor-pointer hover:border-emerald-500/30 transition-all group">
                    <input type="checkbox"
                           name="activo"
                           id="edit_prod_activo"
                           class="w-4 h-4 rounded border-gray-700 text-emerald-500 bg-gray-800 focus:ring-0">
                    <span class="text-gray-400 group-hover:text-white text-[10px] font-bold uppercase tracking-tight">Activo</span>
                </label>
            </div>
            <div class="bg-blue-500/5 border border-blue-500/20 p-3 rounded-2xl flex flex-col justify-center">
                <div class="flex items-center gap-2 text-blue-400 mb-1">
                    <svg class="w-3.5 h-3.5"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="font-bold uppercase text-[9px]">Aviso de base</span>
                </div>
                <p class="text-white/60 text-[9px] leading-tight italic">
                    Cambios en el precio base afectarán cálculos de nuevas variantes.
                </p>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <label class="text-blue-400 text-[11px] uppercase font-bold tracking-[0.2em]">Actualizar Portada</label>
                <div id="zoneEdit"
                     class="relative border-2 border-dashed border-gray-800 rounded-2xl bg-gray-900/30 p-3 flex flex-col items-center justify-center hover:border-blue-500/40 transition-all min-h-[100px] overflow-hidden group">
                    <img id="previewEdit"
                         src=""
                         class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none z-0">
                    <button type="button"
                            id="btnDeletePortadaEdit"
                            onclick="limpiarPreviewImagen('previewEdit', 'contentEdit', 'inputPortadaEdit', 'eliminar_portada_flag_edit')"
                            class="absolute top-2 right-2 bg-red-500 text-white rounded-full w-7 h-7 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all z-30 hidden">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                    <div id="contentEdit" class="relative z-10 flex flex-col items-center">
                        <svg class="w-8 h-8 text-gray-500 group-hover:text-blue-400 mb-2 transition-colors"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p class="text-[9px] text-gray-400 font-bold uppercase">Click para cambiar</p>
                    </div>
                    <input type="hidden"
                           name="eliminar_portada_flag"
                           id="eliminar_portada_flag_edit"
                           value="false">
                    <input type="file"
                           name="imagen"
                           id="inputPortadaEdit"
                           accept="image/*"
                           onchange="handleImagePreview(this, 'previewEdit', 'contentEdit', 'zoneEdit'); document.getElementById('btnDeletePortadaEdit').classList.remove('hidden');"
                           class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                </div>
            </div>
            <div class="space-y-4">
                <label class="text-purple-400 text-[11px] uppercase font-bold tracking-[0.2em]">Galería del Producto</label>
                <div id="zone-galeria-edit"
                     class="relative border-2 border-dashed border-gray-800 rounded-2xl bg-gray-900/30 p-3 min-h-[100px]">
                    <div class="grid grid-cols-4 gap-2" id="galeria-grid-edit">
                        <div id="preview-galeria-edit" class="contents"></div>
                        <button type="button"
                                onclick="document.getElementById('input-galeria-edit').click()"
                                class="flex flex-col items-center justify-center aspect-square rounded-xl border border-dashed border-gray-700 hover:border-purple-500/50 transition-all group">
                            <svg class="w-5 h-5 text-gray-600 group-hover:text-purple-400"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>
                    <input type="file"
                           id="input-galeria-edit"
                           name="imagenes_galeria"
                           accept="image/*"
                           multiple
                           onchange="handleMultiplePreviewsWithDelete(this, 'preview-galeria-edit', 'content-galeria-edit', 'text-galeria-edit')"
                           class="hidden">
                </div>
            </div>
        </div>
        <div class="w-full">
            <label class="text-gray-400 text-[11px] uppercase mb-2 block font-bold tracking-widest">
                Descripción del Producto
            </label>
            <textarea name="descripcion"
                      id="edit_prod_desc"
                      placeholder="Escribe detalles técnicos..."
                      class="w-full bg-gray-900 border border-gray-700 rounded-2xl p-4 text-white resize-none focus:border-blue-500 outline-none min-h-[80px] text-sm leading-relaxed"></textarea>
        </div>
        <div class="flex gap-3 border-t border-gray-800 pt-4">
            <button type="button"
                    onclick="cerrarUltimoModal()"
                    class="px-8 py-4 rounded-xl border border-gray-700 text-gray-500 hover:bg-gray-800 transition-all font-bold text-xs uppercase tracking-widest">
                Descartar
            </button>
            <button type="submit"
                    id="btn-Guardar"
                    class="flex-1 px-4 py-4 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-500 transition-all shadow-xl shadow-blue-500/20 text-xs uppercase tracking-[0.2em]">
                Guardar Cambios
            </button>
        </div>
    </form>
{% endblock modal_content %}
