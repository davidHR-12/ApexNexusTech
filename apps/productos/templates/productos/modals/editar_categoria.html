{% extends "core/modal_base.html" %}
{% block modal_content %}
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-white leading-none">Editar Categoría</h2>
        <p id="edit_cat_nombre_titulo" class="text-gray-400 text-xs mt-1"></p>
    </div>
    <form id="formEditarCategoria" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden"
               name="eliminar_imagen"
               id="eliminar_imagen_input"
               value="false">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-xs uppercase mb-2 block font-semibold">Nombre</label>
                    <input type="text"
                           id="edit_cat_nombre"
                           name="nombre"
                           placeholder="Ej: Bustos, Llaveros..."
                           class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:border-blue-500 outline-none transition-all"
                           required>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase mb-2 block font-semibold">Descripción (Opcional)</label>
                    <textarea id="edit_cat_descripcion"
                              name="descripcion"
                              rows="4"
                              placeholder="¿Qué tipo de piezas se agruparán aquí?"
                              class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white resize-none focus:border-blue-500 outline-none transition-all"></textarea>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-xs uppercase mb-2 block font-semibold text-blue-400">Actualizar Portada</label>
                    <div class="relative group/zone">
                        <div id="zoneEdit"
                             class="p-4 border border-gray-700 border-dashed rounded-lg bg-gray-900/50 flex flex-col items-center justify-center group hover:border-blue-500 transition-colors relative h-[120px] overflow-hidden">
                            <img id="previewEdit"
                                 src=""
                                 class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none z-0">
                            <button type="button"
                                    id="btnDeleteCatEdit"
                                    onclick="limpiarPreviewImagen('previewEdit', 'contentEdit', 'edit_cat_input_file', 'eliminar_imagen_input')"
                                    class="absolute top-2 right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all shadow-lg z-30 hidden">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                            <input type="file"
                                   id="edit_cat_input_file"
                                   name="imagen"
                                   accept="image/*"
                                   class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20"
                                   onchange="handleImagePreview(this, 'previewEdit', 'contentEdit', 'zoneEdit'); document.getElementById('btnDeleteCatEdit').classList.remove('hidden');">
                            <div id="contentEdit"
                                 class="relative z-10 flex flex-col items-center pointer-events-none">
                                <svg class="h-8 w-8 text-gray-500 group-hover:text-blue-400 mb-2" ...>
                                </svg>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">Click para cambiar</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-blue-500/10 p-3 rounded-lg border border-blue-500/20">
                    <p class="text-[10px] text-blue-300 leading-tight">
                        <b class="text-blue-400">Nota:</b> Si seleccionas una nueva imagen, se reemplazará la actual. Deja este campo vacío para mantener la imagen vigente.
                    </p>
                </div>
            </div>
        </div>
        <div class="flex gap-3 pt-6 mt-6 border-t border-gray-800">
            <button type="button"
                    onclick="cerrarModales()"
                    class="flex-1 px-4 py-2.5 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-colors uppercase text-xs font-bold">
                Cancelar
            </button>
            <button type="submit"
                    class="flex-1 px-4 py-2.5 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-500 transition-colors shadow-lg shadow-blue-900/20 uppercase text-xs tracking-wider">
                Guardar Cambios
            </button>
        </div>
    </form>
{% endblock %}
