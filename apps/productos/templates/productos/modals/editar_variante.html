<div id="modal-container" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="cerrarModalDinamico()"></div>

    <div class="relative bg-[#1e293b] w-full max-w-lg rounded-3xl border border-gray-800 shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
        
        <form id="varianteForm" method="POST" action="{{ request.path }}" class="p-6 space-y-6">
            {% csrf_token %}
            
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-white">Editar Parámetros</h3>
                <button type="button" onclick="cerrarModalDinamico()" class="text-gray-500 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <p class="text-emerald-400 text-xs font-bold uppercase tracking-widest">{{ variante }}</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase">Tiempo Estimado (Horas)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2"/></svg>
                        </span>
                        <input type="number" name="tiempo_impresion_horas" step="0.1" 
                               value="{{ form.tiempo_impresion_horas.value|default:0 }}"
                               class="w-full bg-gray-800 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-white focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase">Precio Adicional (RD$)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 font-mono">$</span>
                        <input type="number" name="precio_adicional" step="0.01"
                               value="{{ form.precio_adicional.value|default:0 }}"
                               class="w-full bg-gray-800 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-white focus:border-emerald-500 outline-none transition-all">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between p-4 bg-gray-800/50 rounded-2xl border border-gray-700">
                <div class="flex flex-col">
                    <span class="text-sm font-bold text-white">Variante Principal</span>
                    <span class="text-xs text-gray-500">Se mostrará primero en el catálogo</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="{{ form.es_default.name }}" 
                           id="{{ form.es_default.id_for_label }}"
                           class="sr-only peer"
                           {% if form.es_default.value %}checked{% endif %}>
                    
                    <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:bg-emerald-600 
                                after:content-[''] after:absolute after:top-[2px] after:start-[2px] 
                                after:bg-white after:rounded-full after:h-5 after:w-5 
                                after:transition-all peer-checked:after:translate-x-full"></div>
                </label>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="button" onclick="cerrarModalDinamico()" 
                        class="flex-1 px-4 py-3 rounded-xl bg-gray-800 text-gray-400 font-bold hover:bg-gray-700 transition-all">
                    Cancelar
                </button>
                <button type="submit" 
                        class="flex-[2] px-4 py-3 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-500 shadow-lg shadow-emerald-900/20 transition-all">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
