{% extends "core/modal_base.html" %}
{% block modal_content %}
    <div class="p-6 text-center">
        <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-red-500"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h2 class="text-xl font-bold text-white mb-2">¿Eliminar Categoría?</h2>
        <p class="text-gray-400 text-sm mb-6">
            Estás por eliminar <span id="nombreCatEliminar" class="text-white font-bold"></span>.
            Los productos se moverán a <span class="text-emerald-400 font-bold">Sin Categorizar</span>.
        </p>
        <div class="flex gap-3">
            <button onclick="cerrarUltimoModal()"
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-700 text-gray-400 hover:bg-gray-800 transition-all font-bold text-xs uppercase tracking-widest">
                Cancelar
            </button>
            <button id="btnConfirmarEliminar"
                    class="flex-1 px-4 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-500 transition-all shadow-lg shadow-red-900/20 text-xs uppercase tracking-widest">
                Sí, Eliminar
            </button>
        </div>
    </div>
{% endblock modal_content %}
