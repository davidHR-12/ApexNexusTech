<div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center bg-[#1e293b] p-4 rounded-2xl border border-gray-800 shadow-sm">
    <div class="flex items-center gap-3 w-full md:max-w-md">
        <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </span>
            <input type="text"
                   name="search"
                   value="{{ search_query|default:'' }}"
                   placeholder="Buscar categorías..."
                   class="w-full bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-xl focus:ring-[#10b981] focus:border-[#10b981] block pl-10 p-2.5 transition-all"
                   hx-get="{% url 'productos:productos_index' %}"
                   hx-trigger="keyup changed delay:300ms, search"
                   hx-target="#categorias-container"
                   hx-push-url="true">
        </div>

        <div id="boton-limpiar-container" class="flex items-center min-w-fit">
            {% if search_query %}
                <a href="{% url 'productos:productos_index' %}" 
                   class="text-xs text-red-400 hover:text-red-300 font-bold flex items-center gap-1 transition-colors whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    Limpiar
                </a>
            {% endif %}
        </div>
    </div>

    <div class="flex flex-wrap gap-3 w-full md:w-auto">
        <button onclick="abrirModal('modalNuevaCategoria')"
                class="flex-1 md:flex-none bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-all border border-gray-700 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
            Agregar Categoría
        </button>
        <button onclick="abrirModal('modalNuevoProducto')"
                class="flex-1 md:flex-none bg-[#10b981] text-white hover:bg-[#059669] px-4 py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Nuevo Producto
        </button>
    </div>
</div>
