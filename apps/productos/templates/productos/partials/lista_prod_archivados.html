<div class="max-h-[60vh] overflow-y-auto pr-2 custom-scroll">
    <div class="space-y-3 pb-20">
        {% for p in productos %}
            <div class="flex items-center justify-between p-4 bg-gray-900/40 border border-gray-800 rounded-2xl hover:border-emerald-500/30 transition-all group">
                <div class="flex items-center gap-4">
                    <label class="relative flex items-center cursor-pointer">
                        <input type="checkbox"
                               name="productos_ids"
                               value="{{ p.id }}"
                               class="peer h-5 w-5 cursor-pointer appearance-none rounded-md border border-gray-700 bg-gray-800 checked:bg-emerald-500 checked:border-emerald-500 transition-all"
                               onchange="toggleBatchButton()">
                        <span class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="h-3.5 w-3.5"
                                 viewBox="0 0 20 20"
                                 fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                        </span>
                    </label>
                    <div class="w-10 h-10 rounded-lg bg-gray-800 overflow-hidden">
                        {% if p.imagen %}
                            <img src="{{ p.imagen.url }}"
                                 loading="lazy"
                                 class="w-full h-full object-cover opacity-60">
                        {% endif %}
                    </div>
                    <div>
                        <h4 class="text-white font-bold text-sm">{{ p.nombre }}</h4>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest">ID: #{{ p.id }}</p>
                    </div>
                </div>
                <button onclick="reactivarProducto('{{ p.id }}')"
                        class="px-3 py-1.5 bg-gray-800 text-gray-400 border border-gray-700 rounded-xl text-[10px] font-bold hover:bg-emerald-500 hover:text-white transition-all">
                    Reactivar Solo Este
                </button>
            </div>
        {% empty %}
            <div class="py-8 text-center border-2 border-dashed border-gray-800/50 rounded-2xl bg-gray-900/20">
                <div class="flex justify-center mb-3">
                    <div class="p-3 bg-gray-800/30 rounded-full">
                        <svg class="w-6 h-6 text-gray-700"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                        </svg>
                    </div>
                </div>
                <h3 class="text-gray-400 font-bold text-sm uppercase tracking-tight">No hay productos archivados</h3>
                <p class="text-gray-600 text-[11px] mt-1 px-4">No hay productos desactivados en este momento.</p>
            </div>
        {% endfor %}
    </div>
    <div id="batchActionContainer"
         class="hidden absolute bottom-4 left-0 right-0 px-6">
        <button onclick="reactivarMultiplesProductos()"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-2xl shadow-emerald-900/40 flex items-center justify-center gap-3 transition-all transform hover:scale-[1.02]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>Reactivar<span id="selectedCount">0</span><span id="selectedText"></span>
        </button>
    </div>
</div>
