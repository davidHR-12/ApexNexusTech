<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Ruta No Encontrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0f172a;
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5), 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .glitch-effect {
            animation: glitch 1s linear infinite;
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 overflow-hidden">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 text-center">
        <h1 class="text-[12rem] font-bold text-emerald-500/20 leading-none select-none glitch-effect">
            404
        </h1>
        
        <div class="-mt-20">
            <h2 class="text-4xl md:text-5xl font-bold text-white mb-4 neon-text">
                OBJETO <span class="text-emerald-500">NO ENCONTRADO</span>
            </h2>
            <p class="text-gray-400 text-lg max-w-md mx-auto mb-10">
                La ruta que intentas rastrear no existe en nuestra base de datos o ha sido desintegrada.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">

            <a href="{% if user.is_staff %}/administrador/{% else %}/{% endif %}" 
               class="inline-flex items-center gap-2 px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl transition-all hover:scale-105 shadow-lg shadow-emerald-900/20 uppercase tracking-widest text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Volver al Inicio
            </a>            
            <button onclick="window.history.back()" 
                    class="px-8 py-4 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-2xl font-bold transition-all border border-slate-700 uppercase text-sm tracking-widest">
                Regresar a la página anterior
            </button>
        </div>
    </div>

        <div class="mt-16 flex justify-center gap-4">
            <div class="h-1 w-12 bg-gray-800 rounded-full"></div>
            <div class="h-1 w-12 bg-emerald-500/50 rounded-full"></div>
            <div class="h-1 w-12 bg-gray-800 rounded-full"></div>
        </div>
    </div>
</body>
</html>
